# Robot 2 "Beta" — the Intervener (Pi 3B+ + Mega + GY-87 + camera + pump + arm)
robot:
  id: robot2
  name: Beta
  host: 192.168.1.203
  kind: ros
  user: muc            # SSH user (console diagnostics / shutdown)

ros:
  domain_id: 12
  rosbridge_port: 9090

serial:
  port: /dev/mega
  baud: 115200

zmq:
  telemetry: 5556
  map: 5557              # robot2 publishes no map; port reserved for symmetry
  cmd: 5558
  health: 5559
  video: 5560

camera:
  device: 0
  width: 640
  height: 480
  fps: 15                # Pi 3B+ headroom; 30 was saturating one core
  # 35 -> 80 (2026-06-13) helped YOLO detail, but q80 pushed video to
  # ~5.2 Mbps on Beta's single shared WiFi — telemetry then stalled behind
  # the fat frames and arrived in bursts, so the MAP POSE lagged real motion
  # (2026-06-16). Settled at 60: keeps most detail (~3.5 Mbps) and frees
  # airtime for the 20 Hz telemetry. The dashboard now also coalesces
  # telemetry bursts (transport/zmq_link.py) so the map can't trail even if
  # bandwidth spikes — the two fixes are complementary.
  jpeg_quality: 60
  legacy_port: 5555      # raw-JPEG channel kept for the tmux fallback
                         # streamer compatibility; set to 0 to disable

# Measured chassis (team, 2026-06-11): 30 cm long x 20 cm wide.
# (Reported "axle height 2.0-2.5 cm" must be chassis GROUND CLEARANCE —
# an 85 mm wheel puts its axle at 42.5 mm by geometry. Only the rolling
# diameter matters for odometry.)
footprint:
  length_m: 0.30
  width_m: 0.20
  forward_extent_m: 0.15   # body center → front edge (no onboard lidar)
  rear_extent_m: 0.15
  half_width_m: 0.10

drive:
  # Measured 2026-06-11 — the old 0.065 under-read every distance by 24%.
  wheel_diameter_m: 0.085
  # 25GA370 spec sheet (docs/design_notes/ wheel-odometry fusion doc):
  # 12 PPR × 34:1 gearbox = 408 counts/wheel-rev at 1× decoding — exactly
  # what the firmware ISR counts (RISING on channel A only). The old 330
  # was an empirical pair with the wrong 65 mm wheel; together they nearly
  # cancelled, separately each is wrong.
  ticks_per_rev: 408
  # Wheel CONTACT-CENTER spacing, estimated: 0.20 m chassis + one wheel
  # width. CALIBRATE: command a 360° pivot; if the robot over-rotates,
  # the value is too small (raise it), under-rotates → lower it.
  wheel_base_m: 0.225
  encoder_heading_weight: 0.3
  # Per-unit gyro scale-factor correction. Every MPU6050 reads up to +/-3%
  # off the datasheet 65.5 LSB/(deg/s), and that error is PROPORTIONAL to
  # total rotation — the residual yaw drift after the 50 Hz heading fix.
  # MEASURE IT:  python tools/yaw_calib.py 192.168.1.203
  #   rotate Beta SLOWLY exactly one full physical turn (360, back to a floor
  #   mark); the tool prints the correction factor — paste it here.
  # 1.0 = uncalibrated (datasheet nominal). >1 if it under-reads rotation.
  gyro_scale_correction: 1.0
  max_linear_mps: 0.5
  # Skid-steer pivots scrub four wheels sideways — they need MORE torque
  # than driving. Below ~180 PWM the motors stall-judder ("suffering").
  turn_pwm: 255          # max — pivots scrub 4 wheels; raised from 215 for
                         # faster rotation (was sluggish, esp. on low battery)
  # AUTONOMOUS speed ceilings (bridge declared-param defaults mirror these).
  # Autonomous drives itself, so it must be gentle or it overshoots the
  # ultrasonic stop and clips walls. Forward capped well under manual's 255,
  # pivots under turn_pwm. The dashboard speed slider scales WITHIN these.
  auto_fwd_max_pwm: 185
  auto_turn_pwm: 205
  # Verified 2026-06-11 (direct-serial test): PWM 255 moves hard, but the
  # old 80..255 mapping put the console's DEFAULT speed at ~PWM 132 —
  # below static friction, robot didn't move at all. Drive PWM now maps
  # min_pwm..255 so every slider position actually produces motion.
  min_pwm: 150
  deadman_timeout_s: 0.8
  keepalive_period_s: 0.3
  # Slip gate (carpet): when encoder-implied rotation disagrees with the
  # gyro by more than this, the wheels are scrubbing — odometry takes the
  # gyro for heading and discounts the distance estimate. 0.6 rad/s sits
  # well above gyro bias AND above the error a mis-calibrated wheel_base
  # produces at full pivot rate, so it only fires on genuine slip.
  slip_gate_rad_s: 0.6
  # PWM slew limit (soft launch). Stepping straight to min_pwm 150 /
  # turn_pwm 215 from rest is the torque kick that breaks traction on
  # carpet in the first place. 600/s ramps a dead-stop launch to full
  # PWM in ~175 ms — imperceptible lag, much less wheelspin. Downward
  # changes (slowing, stopping) are NEVER ramped.
  ramp_pwm_per_s: 600

goto:
  goal_tolerance_m: 0.12
  angle_tolerance_rad: 0.15
  max_linear_mps: 0.15
  max_angular_rps: 0.40
  kp_distance: 0.5
  kp_angle: 1.2

# Local navigation fuser (navigation/robot2_local_nav.py) — the single
# /cmd_vel publisher. GOAL mode fuses the laptop's streamed heading bias
# (/cmd_vel_bias) with a repulsion field from the two front ultrasonics;
# WANDER mode is the reactive avoid ladder. Speeds reuse goto.* / ultrasonic.*;
# only the fuser-specific knobs live here.
local_nav:
  # Steer-away gain: a fully-blocked side (prox=1) yields k_rep rad/s of pivot
  # away. Defaults to goto.max_angular_rps so the strongest repulsion can
  # command a full-rate turn. Lower it if obstacle dodging feels twitchy.
  k_rep: 0.40
  # Ignore tiny left/right imbalance so sensor noise near the slow band can't
  # wobble the heading.
  steer_deadband: 0.10
  # WANDER-mode open-space / slow-band forward speeds and reverse-out speed.
  wander_fwd_mps: 0.12
  wander_slow_mps: 0.07
  reverse_mps: 0.10
  # Anti-oscillation: hold a chosen pivot this long; reverse this long when
  # boxed in on both sides.
  turn_lock_s: 1.0
  reverse_time_s: 0.6
  # GOAL-mode deadman: if the laptop's bias stream goes stale for this long
  # (link lost), fall back to reactive WANDER instead of chasing a stale goal.
  bias_stale_s: 0.8
  # SAFETY heartbeat timeout: WANDER runs autonomously on the Pi, so the
  # console re-affirms AUTONOMOUS at ~2 Hz. If that stops (console closed,
  # crashed, or WiFi dropped) for this long, the robot STOPS instead of
  # wandering unattended.
  explore_timeout_s: 2.0
  # Global steering-direction calibration. All steering uses ROS +wz=CCW=left.
  # If on the bench the robot turns INTO obstacles, the chassis/bridge sign is
  # reversed — set this to -1 (no code change needed).
  turn_sign: 1.0

# Two forward-facing HC-SR04 ultrasonics (added 2026-06-13). Beta has no
# lidar, so these are its only real-time obstacle sense — they back-stop
# both manual driving and goto navigation against driving into a wall.
# Firmware reads them round-robin (pins below), median-filters, and appends
# them to the D: packet; the bridge publishes /ultrasonic/{left,right} and
# blocks forward motion under stop_cm; goto slows under slow_cm.
ultrasonic:
  enabled: true
  max_cm: 150          # firmware echo cap = bounds the blocking echo wait (~8.7 ms)
  stop_cm: 25          # forward HARD-STOP threshold (manual + auto)
  clear_cm: 40         # hysteresis: forward re-enabled only above this
  slow_cm: 60          # goto begins proportional slow-down here
  fov_deg: 15          # HC-SR04 beam width (for the Range message)
  # Mount offsets from base_link center (+x forward, +y left), for the
  # Range frame_ids and future map fusion. Sensors sit at the front edge.
  left_x_m:  0.15
  left_y_m:  0.07
  right_x_m: 0.15
  right_y_m: -0.07
  # Firmware pins (Mega) — documented here, defined in the .ino:
  #   LEFT  TRIG=30 ECHO=31    RIGHT TRIG=32 ECHO=33

accessories:
  pump:
    pin: 7               # firmware v5
    active_low: true     # relay module is H/L trigger — verify jumper
    max_run_ms: 5000     # firmware-enforced auto-off
    cooldown_ms: 1000
  servo:
    pin: 5
    min_deg: 10
    max_deg: 170
    slew_dps: 120
    home_deg: 90

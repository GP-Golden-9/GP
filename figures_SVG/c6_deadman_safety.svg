<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 724" width="1100" height="724" font-family="Calibri, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif">
<rect x="0" y="0" width="1100" height="724" fill="#ffffff"></rect>
<defs><filter id="card" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#22305a" flood-opacity="0.13"></feDropShadow></filter></defs>
<rect x="0" y="0" width="1100" height="6" rx="0" ry="0" fill="#1F3864"></rect><rect x="50" y="38" width="103.8" height="24" rx="12" ry="12" fill="#1F3864"></rect><text x="101.9" y="54.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">FIGURE C6</text><text x="50" y="98" font-size="27" font-weight="700" fill="#1F3864" text-anchor="start">Four-Layer Deadman Safety Chain</text><text x="50" y="124" font-size="15" font-weight="400" fill="#44546A" text-anchor="start">Nested timeouts — if the heartbeat stops, every layer independently cuts motion.</text><line x1="50" y1="144" x2="1050" y2="144" stroke="#E6EAF2" stroke-width="1.5"></line><rect x="90" y="232" width="760" height="380" rx="12" ry="12" fill="#F4F6FB" stroke="#1F3864" stroke-width="1.4" filter="url(#card)"></rect><path d="M90,266 L90,244 Q90,232 102,232 L838,232 Q850,232 850,244 L850,266 Z" fill="#1F3864"></path><text x="106" y="255" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">① Console — heartbeat @ 10 Hz  (≈100 ms)</text><rect x="160" y="286" width="620" height="316" rx="12" ry="12" fill="#EAF0F8" stroke="#1F3864" stroke-width="1.4"></rect><path d="M160,320 L160,298 Q160,286 172,286 L768,286 Q780,286 780,298 L780,320 Z" fill="#1F3864"></path><text x="176" y="309" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">② Gateway watchdog — 0.6 s</text><rect x="230" y="340" width="480" height="236" rx="12" ry="12" fill="#E1E9F5" stroke="#1F3864" stroke-width="1.4"></rect><path d="M230,374 L230,352 Q230,340 242,340 L698,340 Q710,340 710,352 L710,374 Z" fill="#1F3864"></path><text x="246" y="363" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">③ Serial-bridge watchdog — 0.8 s</text><rect x="300" y="394" width="340" height="160" rx="12" ry="12" fill="#FBECEA" stroke="#C0504D" stroke-width="1.6"></rect><path d="M300,428 L300,406 Q300,394 312,394 L628,394 Q640,394 640,406 L640,428 Z" fill="#C0504D"></path><text x="316" y="417" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">④ Firmware watchdog — 1.0 s</text><rect x="340" y="470" width="260" height="86" rx="12" ry="12" fill="#C0504D" filter="url(#card)"></rect><g transform="translate(378,513) scale(0.95)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-10 l9,3.2 v6.4 c0,5.8 -4.5,9.2 -9,10.2 c-4.5,-1 -9,-4.4 -9,-10.2 v-6.4 z"></path></g><g transform="translate(378,515) scale(0.5)" fill="none" stroke="#C0504D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-10.5 h8 l7.4,7.4 v8.2 l-7.4,7.4 h-8 l-7.4,-7.4 v-8.2 z" transform="scale(0.8)"></path><line x1="-5" y1="0" x2="5" y2="0"></line></g><text x="482" y="508" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Motors stop</text><text x="482" y="528" font-size="14" font-weight="700" fill="#FBE3E0" text-anchor="middle">+ pump off</text><g transform="translate(120,196) scale(0.7)" fill="none" stroke="#1F3864" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="-13,1 -6,1 -3,-7 1,9 4,-4 7,1 13,1"></polyline></g><text x="140" y="201" font-size="12.5" font-weight="600" fill="#44546A" text-anchor="start">Console emits a 10 Hz heartbeat — each outer layer reacts first.</text><rect x="884" y="300" width="176" height="104" rx="11" ry="11" fill="#ffffff" stroke="#C0504D" stroke-width="1.6" filter="url(#card)"></rect><g transform="translate(908,330) scale(0.6)" fill="none" stroke="#C0504D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-1" width="14" height="11" rx="2"></rect><path d="M-4,-1 v-3.5 a4,4 0 0,1 8,0 v3.5"></path></g><text x="930" y="326" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">E-STOP latch</text><text x="902" y="356" font-size="11.5" font-weight="400" fill="#44546A" text-anchor="start">Operator-triggered, any</text><text x="902" y="371" font-size="11.5" font-weight="400" fill="#44546A" text-anchor="start">state → latched stop</text><text x="902" y="386" font-size="11.5" font-weight="400" fill="#44546A" text-anchor="start">until released.</text><polyline points="884,344 862,344 862,300 850,300" fill="none" stroke="#C0504D" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"></polyline><polygon points="850,300 859,295.32 859,304.68" fill="#C0504D"></polygon><rect x="884" y="440" width="176" height="104" rx="11" ry="11" fill="#ffffff" stroke="#C0504D" stroke-width="1.6" filter="url(#card)"></rect><g transform="translate(908,470) scale(0.6)" fill="none" stroke="#C0504D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-9 C5,-2 6,3 0,9 C-6,3 -5,-2 0,-9 Z"></path><path d="M-3,2 C-3,5 3,5 3,2"></path></g><text x="930" y="466" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start">Pump cap</text><text x="902" y="496" font-size="11.5" font-weight="400" fill="#44546A" text-anchor="start">Water pump is</text><text x="902" y="511" font-size="11.5" font-weight="400" fill="#44546A" text-anchor="start">hard-capped at 5 s per</text><text x="902" y="526" font-size="11.5" font-weight="400" fill="#44546A" text-anchor="start">activation.</text><polyline points="884,492 660,492 660,513 600,513" fill="none" stroke="#C0504D" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"></polyline><polygon points="600,513 609,508.32 609,517.68" fill="#C0504D"></polygon><line x1="50" y1="680" x2="1050" y2="680" stroke="#E6EAF2" stroke-width="1.5"></line><rect x="50" y="694" width="11" height="11" rx="2.5" ry="2.5" fill="#1F3864"></rect><text x="68" y="703" font-size="12.5" font-weight="700" fill="#1F3864" text-anchor="start">Swarm Robot System</text><text x="1050" y="703" font-size="12" font-weight="400" fill="#8A94A6" text-anchor="end">§3.7 Safety · §4.3</text>
</svg>